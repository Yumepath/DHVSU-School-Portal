project_id = "dhvsu-school-portal"

[api]
enabled = true
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/reset-password", "http://127.0.0.1:4200/reset-password"]
enable_signup = false
minimum_password_length = 12

[functions.portal-accounts]
verify_jwt = false
